<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'self'; frame-src about:; base-uri 'none'; form-action 'none'"
    />
    <title>看板内容</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff;
        font:
          14px system-ui,
          sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #render-status {
        box-sizing: border-box;
        margin: 0;
        padding: 32px;
        color: #526073;
      }
      #render-status[role="alert"] {
        color: #a52b36;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script src="/render.js" defer></script>
  </head>
  <body>
    <p id="render-status" role="status">正在安全加载看板…</p>
  </body>
</html>
