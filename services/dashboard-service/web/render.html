<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'self'; frame-src about:; base-uri 'none'; form-action 'none'"
    />
    <title>看板内容</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff;
        font:
          14px system-ui,
          sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #render-status {
        box-sizing: border-box;
        margin: 0;
        padding: 32px;
        color: #526073;
      }
      #render-status[role="alert"] {
        color: #a52b36;
      }
      #render-link-fallback {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 2;
        box-sizing: border-box;
        width: min(480px, calc(100vw - 32px));
        padding: 12px 40px 12px 16px;
        border: 1px solid #d4dbe5;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 4px 20px #182a441f;
        color: #526073;
        line-height: 1.5;
      }
      #render-link-open {
        display: block;
        overflow: hidden;
        color: #2458a6;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #render-link-close {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font-size: 20px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <script src="/render.js" defer></script>
  </head>
  <body>
    <p id="render-status" role="status">正在安全加载看板…</p>
    <aside id="render-link-fallback" role="status" hidden>
      <span id="render-link-hint">打开外部链接：</span>
      <a
        id="render-link-open"
        target="_blank"
        rel="noopener noreferrer"
        referrerpolicy="no-referrer"
      ></a>
      <button id="render-link-close" type="button" aria-label="关闭外链提示">
        ×
      </button>
    </aside>
  </body>
</html>
