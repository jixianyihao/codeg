<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>看板内容</title>
    <link rel="stylesheet" href="/view.css" />
    <script src="/auth-provider.js" defer></script>
    <script src="/view.js" defer></script>
  </head>
  <body>
    <main id="view-status" role="status">
      <p class="view-title">正在安全加载看板…</p>
      <p class="view-hint" data-auth hidden>
        需要企业身份登录后才能查看。
      </p>
      <div class="view-actions">
        <button id="view-login" type="button" data-auth hidden>
          登录后查看
        </button>
        <a id="view-manage" rel="noopener" hidden>打开管理页</a>
        <button id="view-retry" type="button" hidden>重试</button>
      </div>
    </main>
  </body>
</html>
