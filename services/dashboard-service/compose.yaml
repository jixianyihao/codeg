# Local/dev stack. Production values (MySQL, S3, domains, TLS) come from
# the intranet deployment; see .env.example and the README.
services:
  migrate:
    build: .
    command: sh -c "alembic upgrade head && python -m dashboard_service.operator stats"
    env_file: .env
    secrets:
      - source: dashboard-jwt
        target: dashboard-jwt.key
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  control:
    build: .
    command: python -m dashboard_service serve-control --host 0.0.0.0 --port 8080
    env_file: .env
    secrets:
      - source: dashboard-jwt
        target: dashboard-jwt.key
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  content:
    build: .
    command: python -m dashboard_service serve-content --host 0.0.0.0 --port 8081
    env_file: .env
    secrets:
      - source: dashboard-jwt
        target: dashboard-jwt.key
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Development-only MySQL and S3 (MinIO). Production uses the intranet
  # services; swap these out and keep the same env contract.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev-root
      MYSQL_DATABASE: aresclaw_dashboard
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: dev-dashboard
    command: ["--transaction-isolation=READ-COMMITTED"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:

secrets:
  dashboard-jwt:
    file: ${DASHBOARD_JWT_KEY_HOST_FILE:-./secrets/dashboard-jwt.key}
